id: kimai-detect
info:
  name: Kimai - Detect
  author: rxerium
  severity: info
  description: |
    Kimai is an open-source time-tracking application.
  reference:
    - https://www.kimai.org/
    - https://github.com/kimai/kimai
  metadata:
    max-request: 1
    product: kimai
    shodan-query: http.title:"Kimai"
    vendor: kimai
    verified: true
  tags: detect,kimai,tech,time-tracking
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Kimai'
          - "kimai_profile"
        condition: and
      - type: status
        status:
          - 200
