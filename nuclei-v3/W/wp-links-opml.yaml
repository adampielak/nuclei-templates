id: wp-links-opml
info:
  name: WordPress wp-links-opml.php - Version Disclosure
  author: princechaddha
  severity: info
  description: |
    WordPress wp-links-opml.php file was publicly accessible and expossed the WordPress version in the generator tag.
  reference:
    - https://www.acunetix.com/vulnerabilities/web/wordpress-version-disclosed/
    - https://wordpress.org/
  classification:
    cpe: cpe:2.3:a:wordpress:wordpress:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["product"] contains "WordPress:WordPress"
    max-request: 1
    product: wordpress
    shodan-query:
      - http.component:"wordpress"
      - cpe:"cpe:2.3:a:wordpress:wordpress"
    vendor: wordpress
    verified: true
  tags: exposure,files,version,vuln,wordpress,wp
http:
  - extractors:
      - group: 1
        name: version
        regex:
          - (?i)generator="?WordPress/([0-9.]+)"?
        # digest: 4a0a004730450220412afdfecc28e1973af73d22e4da1dbd9f39740b4ccd243d46cf42bc6a6f897f022100e30a86d0bb0b80580cea1ac2233e256cc31ce9455c4e5fbadf70533fd0c0fff8:922c64590222798bb761d5b6d8e72950

        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - generator=
          - WordPress/
      - part: header
        type: word
        words:
          - text/xml
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/wp-links-opml.php'
