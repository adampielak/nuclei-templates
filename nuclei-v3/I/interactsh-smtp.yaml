id: interactsh-smtp

info:
  name: ProjectDiscovery Interact.sh SMTP - Detect
  author: darses
  severity: info
  description: |
    Detect Interact.sh SMTP service.
  reference:
    - https://github.com/projectdiscovery/interactsh
  metadata:
    verified: true
    max-requests: 1
    vendor: projectdiscovery
    product: interactsh
    shodan-query:
      - product:"Interactsh SMTP Server"
  tags: detect,network,tcp,smtp,interactsh

tcp:
  - inputs:
      - data: "\r\n"
    
    host:
      - "{{Hostname}}"
    
    port: 25,2525,465,587

    matchers:
      - type: word
        condition: and
        words:
          - "interactsh"
          - "SMTP"

    extractors:
      - type: regex
        group: 1
        regex:
          - "220 ([^\\s]+) interactsh"
