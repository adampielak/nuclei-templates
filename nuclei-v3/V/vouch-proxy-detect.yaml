id: vouch-proxy-detect
info:
  name: Vouch Proxy - Detect
  author: rxerium
  severity: info
  description: |
    Vouch Proxy is an SSO and OAuth or OIDC authentication proxy for Nginx auth_request integrations.
  reference:
    - https://github.com/vouch/vouch-proxy
  metadata:
    max-request: 1
    product: vouch_proxy
    shodan-query: http.title:"Vouch Proxy - 400 Bad Request"
    vendor: vouch
    verified: true
  tags: detect,oauth,oidc,sso,tech,vouch-proxy
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - 'vouch-failcount='
          - 'X-Vouch-Token='
        condition: and
      - type: status
        status:
          - 302
