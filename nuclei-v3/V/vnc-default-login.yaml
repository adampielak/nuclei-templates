id: vnc-default-login
info:
  name: VNC Default Login
  author: pussycat0x
  severity: high
  description: |
    The VNC service had been accessed using easily guessed credentials.Weak credentials allowed unauthorized access to the VNC service.
  metadata:
    shodan-query: product:"vnc"
    verified: true
  tags: default-login,js,network,vnc,vuln
javascript:
  - args:
      Host: '{{Host}}'
      Password: '{{passwords}}'
      Port: 5900
    code: |
      var vnc = require('nuclei/vnc');
      var client = new vnc.VNCClient();
      var resp = client.Connect(Host, Port, Password);
      resp;
    matchers:
      - condition: and
        # digest: 4a0a00473045022100b41c196a41fddd8056ba1ca9881266f74f8730f0775b0d1b62ed097e8ce2b2780220130cf0e0483f5b3cc56dcb61adaedff64b047a5b7a35cefd115ae02d88f51c50:922c64590222798bb761d5b6d8e72950

        dsl:
          - success == true
          - response == true
        type: dsl
    payloads:
      passwords:
        - password123
        - mysecret
        - password
        - admin
        - iamadmin
    pre-condition: |
      isPortOpen(Host,Port);
    stop-at-first-match: true
