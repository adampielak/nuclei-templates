id: monsta-ftp-detect
info:
  name: Monsta FTP - Detect
  author: rxerium
  severity: info
  description: |
    Detects Monsta FTP web-based file manager interface.
  reference:
    - https://www.monstaftp.com/
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Monsta FTP"})
    max-request: 1
    shodan-query: http.title:"Monsta FTP"
    verified: true
  tags: detect,discovery,ftp,monsta,tech
http:
  - extractors:
      - group: 1
        name: version
        regex:
          - monsta-min-([0-9.]+)\.js
        # digest: 4a0a0047304502206078af19c1af1d1424fe7b273b4f902062f4f1de854e4127325b19be468a2bde0221009b3f1bb9381e62b739915bd5ea487c4d9bf5b4bf6f251a4532bddd63983eb610:922c64590222798bb761d5b6d8e72950

        type: regex
    host-redirects: true
    matchers:
      - condition: and
        type: word
        words:
          - ng-app="MonstaFTP"
          - <title>Monsta FTP
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
