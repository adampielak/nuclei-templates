id: metasfresh-detect
info:
  name: metasfresh - Detect
  author: rxerium
  severity: info
  description: |
    metasfresh is an open-source enterprise resource planning system.
  reference:
    - https://metasfresh.com/
    - https://github.com/metasfresh/metasfresh
  metadata:
    max-request: 1
    product: metasfresh
    shodan-query: http.title:"metasfresh"
    vendor: metasfresh
    verified: true
  tags: detect,erp,metasfresh,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>metasfresh</title>'
          - '/bundle-[a-z0-9-]+\.js'
        condition: and
      - type: word
        part: body
        words:
          - '<script src="/config.js"></script>'
      - type: status
        status:
          - 200
