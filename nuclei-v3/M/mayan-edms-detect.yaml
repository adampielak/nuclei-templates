id: mayan-edms-detect
info:
  name: Mayan EDMS - Detect
  author: rxerium
  severity: info
  description: |
    Mayan EDMS is an open-source electronic document management system.
  reference:
    - https://www.mayan-edms.com/
    - https://github.com/mayan-edms/Mayan-EDMS
  metadata:
    max-request: 1
    product: mayan-edms
    shodan-query: http.title:"Mayan EDMS"
    vendor: mayan-edms
    verified: true
  tags: detect,dms,edms,mayan-edms,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'content="Mayan EDMS" name="title"'
          - 'mayan-edms-logo'
        condition: and
      - type: status
        status:
          - 200
