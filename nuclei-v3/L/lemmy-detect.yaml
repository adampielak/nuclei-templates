id: lemmy-detect
info:
  name: Lemmy - Detect
  author: rxerium
  severity: info
  description: |
    Lemmy is a federated link aggregation and discussion platform.
  reference:
    - https://join-lemmy.org/
    - https://github.com/LemmyNet/lemmy
  metadata:
    max-request: 1
    product: lemmy
    shodan-query: 'http.html:"window.isoData" http.html:"site_res"'
    vendor: lemmy
    verified: true
  tags: detect,fediverse,forum,lemmy,social,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'window.isoData = {'
          - '"site_res":'
          - '"local_site":'
        condition: and
      - type: status
        status:
          - 200
