id: logrocket-rum-detect
info:
  name: LogRocket RUM - Detect
  author: Shivam Kamboj
  severity: info
  description: |
    Detects LogRocket Session Replay & Frontend Monitoring artifacts.
  reference:
    - https://logrocket.com/
  metadata:
    fofa-query: body="LogRocket.init" || body="cdn.logrocket.io"
    max-request: 1
    product: logrocket
    shodan-query: http.html:"LogRocket.init"
    vendor: logrocket
    verified: true
  tags: detect,discovery,logrocket,rum,tech
http:
  - matchers:
      - condition: and
        # digest: 4a0a004730450220055ef490ac7a6664e16da494b884e1c8098e9f1153bdfd03ee9e7ff8e14d096602210084883795a11a96fbc1c1b6116c08bc721007d4c3ad75365ff142cbddd0a23d60:922c64590222798bb761d5b6d8e72950

        dsl:
          - status_code == 200
          - contains(body, "LogRocket.min.js")
        type: dsl
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
    redirects: true
