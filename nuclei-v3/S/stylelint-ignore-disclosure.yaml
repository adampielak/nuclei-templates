id: stylelint-ignore-disclosure
info:
  name: Stylelint - Ignore File Disclosure
  author: ritikchaddha
  severity: info
  description: |
    The .stylelintignore file is publicly accessible, potentially revealing project structure, sensitive file paths, and internal directory organization.
  reference:
    - https://stylelint.io/user-guide/ignore-code
  metadata:
    fofa-query: body=".stylelintignore"
    max-request: 1
    shodan-query: http.html:".stylelintignore"
    verified: true
  tags: config,disclosure,exposure,stylelintignore,vuln
http:
  - matchers:
      - condition: and
        dsl:
          - status_code == 200
          - len(body) > 30
          - contains_any(content_type, 'application/octet-stream', 'text/plain')
        type: dsl
      - negative: true
        # digest: 4b0a00483046022100d1e88531ce183a20dde0e0f9027d3a022d60e113d92c9b4f1419615e2b7d5a7c022100c07cd07c3dcd0ecb82cd134bdeca26cc2722d80f6e92c74e02f9a5a56d7d2616:922c64590222798bb761d5b6d8e72950

        part: response
        type: word
        words:
          - MongoDB over HTTP on the native
          - application/javascript
          - application/x-javascript
          - application/json
          - application/xml
          - text/xml
          - <html
          - <!doctype
          - <script
          - <meta
          - image/
          - Response xmlns
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/.stylelintignore'
