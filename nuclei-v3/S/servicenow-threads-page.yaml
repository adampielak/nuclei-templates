id: servicenow-threads-page
info:
  name: ServiceNow Threads Page - Detection
  author: cham423
  severity: info
  description: |
    Detects exposed ServiceNow thread information pages (threads.do) that reveal cluster and system details.
  reference:
    - https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0517269
    - https://www.servicenow.com/community/servicenow-ai-platform-forum/is-there-a-way-to-restrict-access-to-the-stats-do-page/m-p/1026919
  metadata:
    max-request: 1
    shodan-query: http.component:"ServiceNow"
    verified: true
  tags: exposure,misconfig,servicenow,vuln
http:
  - extractors:
      - group: 1
        name: cluster_node
        regex:
          - Connected to cluster node:\s*([^\s<]+)
        # digest: 4b0a00483046022100d8a84d19ab8c956df5187c91303eb47162c2357d81df4ad9c5a6d7800f83e8ce022100fb2e8483d3414820e27b6d75f8851052591db3394c1dd9efa3c244797938e07c:922c64590222798bb761d5b6d8e72950

        type: regex
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains_all(tolower(body), "servlet thread information", "java.base")
        type: dsl
    method: GET
    path:
      - '{{BaseURL}}/threads.do'
