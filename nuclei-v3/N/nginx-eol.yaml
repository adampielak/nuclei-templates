id: nginx-eol
info:
  name: Nginx End-of-Life - Detect
  author: Shivam Kamboj
  severity: info
  description: |
    Detected Nginx versions that have reached End-of-Life (EOL) and no longer receive security updates.
  reference:
    - https://endoflife.date/nginx
    - https://nginx.org/en/download.html
  metadata:
    max-request: 1
    product: nginx
    shodan-query: 'Server: nginx/'
    vendor: nginx
    verified: true
  tags: discovery,eol,nginx,tech
http:
  - extractors:
      - group: 1
        name: version
        part: header
        regex:
          - 'Server: nginx/([0-9.]+)'
        # digest: 4a0a00473045022100baf43ead051ce98985f1ce4583ce1fe389e58b9e4f3324debd9c42c2fc396cd502202f1449899b07b79cede87a863adea7b23170330aaa776a31e1b6670345951dca:922c64590222798bb761d5b6d8e72950

        type: regex
    host-redirects: true
    matchers:
      - condition: and
        dsl:
          - compare_versions(version, '<1.28.0')
          - contains(server, 'nginx')
        type: dsl
    max-redirects: 3
    method: GET
    path:
      - '{{BaseURL}}'
    stop-at-first-match: true
