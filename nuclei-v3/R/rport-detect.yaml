id: rport-detect
info:
  name: RPort - Detect
  author: rxerium
  severity: info
  description: |
    RPort is an open-source remote access and remote management platform.
  reference:
    - https://github.com/realvnc-labs/rport
  metadata:
    max-request: 1
    product: rport
    shodan-query: http.title:"rport"
    vendor: realvnc-labs
    verified: true
  tags: discovery,remote-access,remote-management,rport,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>rport</title>"
          - "This browser is not supported"
        condition: and
      - type: status
        status:
          - 200
