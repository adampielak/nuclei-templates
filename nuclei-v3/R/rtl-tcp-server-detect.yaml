id: rtl-tcp-server-detect
info:
  name: RTL-TCP Server Detection
  author: RandomRobbie
  severity: info
  description: |
    Discovers RTL-TCP servers utilized for Software Defined Radio (SDR). RTL-TCP enables remote access to RTL-SDR dongles via TCP connections. These servers are compatible with SDR applications such as SDR#, GQRX, CubicSDR, and others
  reference:
    - https://github.com/steve-m/librtlsdr
    - https://osmocom.org/projects/rtl-sdr/wiki/Rtl-sdr
  metadata:
    max-request: 2
    verified: true
  tags: detect,discovery,iot,network,radio,rtl-sdr,sdr
tcp:
  - extractors:
      - kval:
          - host
          - port
        # digest: 4b0a00483046022100c7dd4227e8940c8b5d5bf550cae88edb41f76139a8b6972118e0540afbd7f4470221008cc3310d40ff6687a6c74300fa039c81d906994f0341785ae4458184ba6c8ee6:922c64590222798bb761d5b6d8e72950

        name: server-info
        type: kval
    host:
      - '{{Hostname}}'
    inputs:
      - data: '{{hex_decode(''01000000070b8140'')}}'
      - data: '{{hex_decode(''020000000024f600'')}}'
    matchers:
      - name: rtl0-handshake
        type: word
        words:
          - RTL0
      - condition: or
        name: sdr-software
        type: word
        words:
          - SoapySDR
          - GNU Radio
          - rtl_tcp
      - dsl:
          - len(body) > 100
        name: iq-data-stream
        type: dsl
    matchers-condition: or
    port: 1234,8888,50000,50001,1235,8889
    read-size: 1024
