id: xspeeder-login
info:
  name: XSpeeder Login - Detect
  author: rxerium
  severity: info
  description: |
    Detects the presence of XSpeeder router login panels.
  reference:
    - https://www.xspeeder.com/
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)神行者路由"})
    fofa-query: title="神行者路由"
    max-request: 1
    product: xspeeder_router
    shodan-query: http.title:"神行者路由"
    vendor: Changsha Tongxun Computer Technology Co., Ltd
    verified: true
  tags: detect,discovery,login,panel,router,xspeeder
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>神行者路由
      - status:
          - 200
        # digest: 4b0a004830460221008765f1370506bf473ba3c0d5ac52096651e8ab3e6322388195f6075234119d16022100afbe4e880c58e265553e7f5c8a522439db617611c32aac926a67b2341446bc22:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login/?nLang=1'
