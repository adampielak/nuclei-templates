id: xwiki-detect

info:
  name: XWiki - Detection
  author: darses
  severity: info
  description: |
    XWiki Platform was detected.
  reference:
    - https://www.xwiki.org/
  metadata:
    verified: true
    max-requests: 1
    vendor: xwiki
    product: xwiki
    shodan-query:
      - http.favicon.hash:831700033
      - http.html:"data-xwiki"
    fofa-query:
      - icon_hash="831700033"
      - body="data-xwiki"
  tags: xwiki,tech,detect

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 3

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "xwikiplatformversion"
          - "data-xwiki"
        condition: or

      - type: status
        status:
          - 200
          - 401

    extractors:
      - type: regex
        group: 1
        regex:
          - 'xwikiplatformversion">\s*<a[^>]+>\s*([\w\d\s\.\-]+?)\s*</a>'
