id: graphql-ariadne-detect
info:
  name: Graphql Ariadne Detect
  author: princechaddha
  severity: info
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  tags: ariadne,discovery,graphql,tech
http:
  - body: '{"query":"query { __typename @abc }"}'
    headers:
      Content-Type: application/json
    matchers:
      - status:
          - 200
        type: status
      - part: body
        type: word
        words:
          - Unknown directive '@abc'.
      - negative: true
        part: header
        type: word
        words:
          - 'Content-Type: text/html'
      - condition: or
        negative: true
        # digest: 4b0a00483046022100fb6e69c3f3fa20e1b73b943f1071db799732e7536da8dc64be85d91c5ebf3209022100f87e512ac5ac2347d8861506c2a179707a3a2150a010f1b7c5206d78342d592e:922c64590222798bb761d5b6d8e72950

        part: body
        type: word
        words:
          - <html
          - <body
    matchers-condition: and
    method: POST
    path:
      - '{{BaseURL}}/graphql'
      - '{{BaseURL}}/api/graphql'
      - '{{BaseURL}}/query'
      - '{{BaseURL}}/'
    redirects: true
