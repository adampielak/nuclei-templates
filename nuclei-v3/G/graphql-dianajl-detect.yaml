id: graphql-dianajl-detect
info:
  name: Graphql Dianajl Detect
  author: princechaddha
  severity: info
  reference:
    - https://github.com/dolevf/graphw00f/blob/main/graphw00f/lib.py
  tags: dianajl,discovery,graphql,tech
http:
  - body: '{"query":"queryy { __typename }"}'
    headers:
      Content-Type: application/json
    matchers:
      - status:
          - 200
          - 400
        type: status
      - part: body
        # digest: 490a00463044022062d873e36f5f14a12b3b805c5e0fdca72e2686e25166efeebf4201603466ec2b022050265bde7991a3505e95eacb5ed40fb365eb496654159c72f4b0825f9843863b:922c64590222798bb761d5b6d8e72950

        type: word
        words:
          - Syntax Error GraphQL request (1:1) Unexpected Name "queryy"
    matchers-condition: and
    method: POST
    path:
      - '{{BaseURL}}/graphql'
      - '{{BaseURL}}/api/graphql'
      - '{{BaseURL}}/query'
      - '{{BaseURL}}/'
    redirects: true
