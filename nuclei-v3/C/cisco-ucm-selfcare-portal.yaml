id: cisco-ucm-selfcare-portal
info:
  name: Cisco Unified Communications Self-Service User Portal - Detection
  author: Morgan Robertson
  severity: info
  description: |
    Detected the presence of the Cisco Unified Communications User Management Panel.
  metadata:
    runzero-match: service["product"] contains "Cisco:Unified Communications Manager"
    fofa-query: title="Unified Communications Self Care Portal"
    product: unified_communications_manager
    shodan-query: http.title:"Unified Communications Self Care Portal"
    vendor: cisco
    verified: true
  tags: cisco,detect,discovery,panel,ucm
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - 'webAppName: "ucmuser"'
          - webAppName="ucmuser"
      - status:
          - 200
        # digest: 4a0a00473045022100b8662b280cef1aa13916aeac6e5536d46bb10abc7821bd5bd57d3382b0c8de44022008df6291ff4784d8479d64f75d4e56acf6ae24a785b262a875f6dc9e15cd7aa2:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/ucmuser/'
