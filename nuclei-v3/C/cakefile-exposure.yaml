id: cakefile-exposure
info:
  name: Cakefile - Exposure
  author: 0x_Akoko
  severity: info
  description: |
    Detected CoffeeScript Cakefile was exposing build tasks and project structure.
  reference:
    - https://coffeescript.org/v2/#cake
  classification:
    cwe-id: CWE-538
  metadata:
    max-request: 7
    verified: true
  tags: cakefile,coffeescript,config,exposure,vuln
http:
  - matchers:
      - condition: and
        type: word
        words:
          - 'task '
          - 'require '
          - ->
      - negative: true
        type: word
        words:
          - <!DOCTYPE
          - <html
          - '{"props"'
          - <script
      - condition: or
        type: word
        words:
          - coffee
          - spawn
          - exec
          - invoke
          - fs.readFileSync
      - status:
          - 200
        # digest: 4a0a00473045022100a6b04ec50990444216b388cf5c5bab2eeefa6f407835743665d5b9a30d17a0a9022053470f5109a107e247f77124ab50d56effb514811c59e63bed3b4627157b97d0:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/Cakefile'
      - '{{BaseURL}}/src/Cakefile'
      - '{{BaseURL}}/app/Cakefile'
      - '{{BaseURL}}/lib/Cakefile'
      - '{{BaseURL}}/build/Cakefile'
      - '{{BaseURL}}/node_modules/whet.extend/Cakefile'
      - '{{BaseURL}}/node_modules/Cakefile'
    stop-at-first-match: true
