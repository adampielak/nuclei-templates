id: psitransfer-detect
info:
  name: PsiTransfer - Detect
  author: rxerium
  severity: info
  description: |
    PsiTransfer is a self-hosted file-sharing application for expiring uploads.
  reference:
    - https://github.com/psi-4ward/psitransfer
  metadata:
    max-request: 1
    product: psitransfer
    shodan-query: http.title:"PsiTransfer"
    vendor: psi-4ward
    verified: true
  tags: detect,file-sharing,psitransfer,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<title>PsiTransfer</title>"
          - "github.com/psi-4ward/psitransfer"
        condition: and
      - type: status
        status:
          - 200
