id: schneider-modicon-340-detect
info:
  name: Schneider Electric Modicon 340 Series PLC - Detect
  author: biero-el-corridor
  severity: info
  description: |
    Detected Schneider Electric Modicon 340 series PLCs by identifying the BMX P34 signature via the UMAS protocol over Modbus TCP (port 502).The Modicon 340 series is part of Schneider Electric’s industrial automation product line used in Industrial Control Systems (ICS).
  metadata:
    shodan-query: port:502 "P34"
    verified: true
  tags: detect,discovery,ics,modicon,network,schenider
tcp:
  - host:
      - '{{Hostname}}'
    inputs:
      - data: 000000000005002b0e0200
        name: info
        read: 200
        type: hex
      - data: 000100000004005a0002
        name: note
        read: 200
        type: hex
    matchers:
      - part: note
        type: word
        words:
          - BMX P34
      - part: info
        type: word
        words:
          - Schneider Electric
          # digest: 490a004630440220341faaf27672a587bffde3073f992432bbc821dfc29d59fc3766eb3333ecf30702204eb3c2d0214518df1dfb730acd65785bd30d363f48e0f8cbb6ed03b92a549e32:922c64590222798bb761d5b6d8e72950
    matchers-condition: and
    port: 502
    read-size: 1024
