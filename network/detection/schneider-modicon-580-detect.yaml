id: schneider-modicon-580-detect
info:
  name: Schneider Electric Modicon 580 Series PLC - Detect
  author: biero-el-corridor
  severity: info
  description: |
    Detected Schneider Electric Modicon 580 series PLCs by identifying the BME P58 signature via the UMAS protocol over Modbus TCP (port 502).The Modicon 580 series is part of Schneider Electric’s industrial automation product line used in Industrial Control Systems (ICS).
  metadata:
    max-request: 2
    shodan-query: port:502 "P58"
    verified: true
  tags: detect,discovery,ics,modicon,network,schenider
tcp:
  - host:
      - '{{Hostname}}'
    inputs:
      - data: 000000000005002b0e0200
        name: info
        read: 200
        type: hex
      - data: 000100000004005a0002
        name: note
        read: 200
        type: hex
    matchers:
      - part: note
        type: word
        words:
          - BME P58
      - part: info
        type: word
        words:
          - Schneider Electric
          # digest: 4a0a00473045022100b9e83847cd0a65c0dfc011d86cda0aa5176b8732806a9b759108f9dfe33769fd0220639b6d21704d28b922e17d71fa2c8598767b4ed99fc4dc6fdb3d0d547556be2b:922c64590222798bb761d5b6d8e72950
    matchers-condition: and
    port: 502
    read-size: 1024
