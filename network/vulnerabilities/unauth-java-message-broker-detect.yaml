id: unauth-java-message-broker-detect
info:
  name: Unauthenticated Java Message Broker - Detect
  author: matejsmycka
  severity: low
  description: |
    Detection of a Java Message Service (JMS) broker, typically used by Oracle GlassFish Message Queue and Payara Application Server. This port should remain closed to the internet, as it enables unauthenticated access to messaging services.
  metadata:
    shodan-query: product:"Java Message Service"
    verified: true
  tags: jms,network,openmq,tcp,unauth,vuln
tcp:
  - extractors:
      - regex:
          - imqbroker ([0-9.]+)
        # digest: 4a0a0047304502203db0003c1b0606dc3e8bfba3b8ff37c242c2c0b1e602f04b2b36129c50497f05022100fcea782e96984c0adc9f8f0d8251b2cd2d9846b14833cea2a14957e3561aee17:922c64590222798bb761d5b6d8e72950

        type: regex
    host:
      - '{{Hostname}}'
    inputs:
      - data: ""
    matchers:
      - condition: and
        type: word
        words:
          - 101 imqbroker
          - cluster_discovery
    port: 7676
