# gap: redis-unauthenticated-access
id: redis-unauthenticated-access

info:
  name: Redis Unauthenticated Access
  author: TyrusRC
  severity: critical
  description: |
    Redis server accepts connections without authentication. An attacker can
    read/write all data, execute arbitrary commands via Lua scripts
    (RCE via io.popen on Redis <=6), change server configuration
    (CONFIG SET dir/dbfilename for arbitrary file write), and perform
    denial-of-service (FLUSHALL, DEBUG SEGFAULT).
  tags: custom,network,redis,misconfig,rce

tcp:
  - inputs:
      - data: "PING\r\n"
    host:
      - "{{Hostname}}"
    port: 6379
    read-size: 32

    matchers:
      - type: word
        words:
          - "+PONG"
