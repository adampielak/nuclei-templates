# gap: cookie-weak-secret-detection
id: cookie-weak-secret-detection

info:
  name: Framework Cookie Signed with Default or Weak Secret Key
  author: TyrusRC
  severity: high
  description: |
    Detects web applications using default or well-known secret keys for
    session cookie signing. When a framework exposes secret credential
    material through a predictable default, an attacker can forge session
    cookies and escalate to any user including admin.
  reference:
    - https://book.hacktricks.xyz/network-services-pentesting/pentesting-web/flask#flask-unsign
    - https://cwe.mitre.org/data/definitions/798.html
  tags: custom,cookie,secret,session,flask,django,express,rails

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: or
    matchers:
      - type: regex
        part: header
        name: flask-default
        regex:
          - 'Set-Cookie:.*session=eyJ'
      - type: regex
        part: header
        name: express-unsigned
        regex:
          - 'Set-Cookie:.*connect\.sid=s%3A[A-Za-z0-9+/=]+'
      - type: regex
        part: header
        name: django-session
        regex:
          - 'Set-Cookie:.*sessionid=[a-z0-9]{32}'
      - type: regex
        part: header
        name: rails-session
        regex:
          - 'Set-Cookie:.*_session=[A-Za-z0-9+/=%]+'
      - type: regex
        part: header
        name: play-session
        regex:
          - 'Set-Cookie:.*PLAY_SESSION=[A-Za-z0-9+/=%]+'
      - type: regex
        part: header
        name: tornado-session
        regex:
          - 'Set-Cookie:.*_xsrf=[A-Za-z0-9|]+'

    extractors:
      - type: kval
        part: header
        kval:
          - set-cookie
