id: grafana-login-check
info:
  name: Grafana Login Check
  author: parthmalhotra,pdresearch
  severity: critical
  description: Checks for a valid login on self hosted Grafana instance.
  reference:
    - https://owasp.org/www-community/attacks/Credential_stuffing
  classification:
    cpe: cpe:2.3:a:grafana:grafana:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Grafana"})
    fofa-query: title="Grafana"
    max-request: 1
    product: grafana
    shodan-query: title:"Grafana"
    vendor: grafana
  tags: creds-stuffing,grafana,login-check,self-hosted,vuln
variables:
  username: "{{username}}"
  password: "{{password}}"
http:
  - raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}
        accept: application/json, text/plain, */*
        DNT: 1
        content-type: application/json
        Origin: {{BaseURL}}
        Referer: {{BaseURL}}/login
        Cookie: redirect_to=%2F

        {"user":"{{username}}","password":"{{password}}"}
    extractors:
      - type: dsl
        dsl:
          - username
          - password
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'Logged in'
      - type: word
        part: header
        words:
          - 'grafana_session'
      - type: status
        status:
          - 200
