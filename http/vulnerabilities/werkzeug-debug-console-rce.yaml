id: werkzeug-debug-console-rce

info:
  name: Werkzeug Debug Console Exposed (RCE)
  author: TyrusRC
  severity: critical
  description: |
    Detects the Werkzeug interactive debugger at /console. When Flask
    runs in debug mode, this endpoint allows arbitrary Python code
    execution. The debugger is PIN-protected by default since Werkzeug
    0.11, but older versions or misconfigured deployments may expose
    it without a PIN. Even with the PIN, the console's presence
    confirms debug mode is active (stack traces, source code, local
    variables on every unhandled exception).
  reference:
    - https://werkzeug.palletsprojects.com/en/latest/debug/
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/06-Test_HTTP_Methods
  tags: custom,vulnerabilities,flask,werkzeug,debug,rce,python

http:
  - method: GET
    path:
      - "{{BaseURL}}/console"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        condition: or
        words:
          - "Werkzeug"
          - "Interactive Console"
          - "debugger"
          - "Console Locked"
          - "traceback"

    extractors:
      - type: regex
        part: body
        regex:
          - '(Werkzeug[^<"]{0,60}|Interactive Console|Console Locked|SECRET = "[^"]{0,40}")'
