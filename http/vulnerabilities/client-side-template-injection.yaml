# gap: client-side-template-injection
id: client-side-template-injection

info:
  name: Client-Side Template Injection (CSTI)
  author: TyrusRC
  severity: high
  description: |
    Detects client-side template injection in Angular, Vue, and other
    JavaScript frameworks. When user input is rendered inside template
    expressions without sanitization, an attacker can execute arbitrary
    JavaScript in the victim's browser, bypassing CSP in some cases.
  reference:
    - https://portswigger.net/research/xss-without-html-client-side-template-injection-with-angularjs
    - https://cwe.mitre.org/data/definitions/94.html
  tags: custom,csti,template-injection,xss,angular,vue

http:
  - method: GET
    path:
      - "{{BaseURL}}/?q={{7*7}}"
      - "{{BaseURL}}/?search={{7*7}}"
      - "{{BaseURL}}/?name={{7*7}}"
      - "{{BaseURL}}/?input={{7*7}}"
      - "{{BaseURL}}/?q={{constructor.constructor('return+1')()}}"
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - "49"
      - type: word
        part: body
        negative: true
        words:
          - "{{7*7}}"
          - "{{constructor"
