id: adcs-certificate
info:
  name: Microsoft AD CS Web Enrollment - Detect
  author: pastaga,defte,atomiczsec
  severity: info
  description: |
    Detects Microsoft Active Directory Certificate Services (AD CS) Web Enrollment and certificate download pages.
  metadata:
    max-request: 3
    shodan-query: html:"/certenroll"
    verified: true
  tags: ad,adcs,detect,exposure,files,vuln,web-enrollment
http:
  - host-redirects: true
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - regex("(?i)href=[^>]*[.](crl|crt|cer|p7b)[^a-z0-9]", body)
          - contains_any(tolower(body), "certenroll", "locmscertsrv", "certificate services")
        name: certenroll
        type: dsl
      - condition: and
        # digest: 490a00463044022012ce913a5bff72f3fdf9a3eee19fd2d1ac3e7b50dda18956a6636af154d1f1f302201903224966bdb24cda969ae1573bfb785c78ebf52cdc64ab135ef87264bedf83:922c64590222798bb761d5b6d8e72950

        dsl:
          - status_code == 200 || status_code == 401 || status_code == 403
          - contains_any(tolower(body), "locmscertsrv", "certificate services", "web enrollment")
        name: certsrv
        type: dsl
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/certenroll/'
      - '{{BaseURL}}/CertEnroll/'
      - '{{BaseURL}}/certsrv/'
      - '{{BaseURL}}/certsrv'
    stop-at-first-match: true
