id: glitchtip-detect
info:
  name: GlitchTip - Detect
  author: rxerium
  severity: info
  description: |
    GlitchTip is an open-source error tracking and application performance monitoring platform.
  reference:
    - https://glitchtip.com/
    - https://gitlab.com/glitchtip/glitchtip
  metadata:
    max-request: 1
    product: glitchtip
    shodan-query: http.title:"GlitchTip"
    vendor: glitchtip
    verified: true
  tags: detect,glitchtip,monitoring,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>GlitchTip</title>'
          - '<base href="/"'
        condition: and
      - type: word
        part: header
        words:
          - 'glitchtip.com'
      - type: status
        status:
          - 200
