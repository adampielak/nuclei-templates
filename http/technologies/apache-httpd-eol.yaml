id: apache-httpd-eol
info:
  name: Apache HTTP Server End-of-Life - Detect
  author: Shivam Kamboj
  severity: info
  description: |
    Detected Apache HTTP Server versions that have reached End-of-Life (EOL) and no longer receive security updates.
  reference:
    - https://httpd.apache.org/
    - https://endoflife.date/apache
  metadata:
    max-request: 1
    product: http_server
    shodan-query: 'Server: Apache/'
    vendor: apache
    verified: true
  tags: apache,discovery,eol,tech
http:
  - extractors:
      - group: 1
        name: version
        part: header
        regex:
          - 'Server: Apache/([0-9.]+)'
        # digest: 4a0a00473045022100e7629937b6cd365b29928349ffc44a79e691c4f65bd2f11e778bdb2576e22a5e0220148daad7f6be600fada5720e8fec4949dd20774c3887bee2618ba3b0700b823d:922c64590222798bb761d5b6d8e72950

        type: regex
    matchers:
      - condition: and
        dsl:
          - compare_versions(version, '<=2.2.34')
          - contains(server, 'Apache')
        type: dsl
    method: GET
    path:
      - '{{BaseURL}}'
