id: cisco-ucm-detect
info:
  name: Cisco Unified Communications Manager - Detect
  author: Morgan Robertson
  severity: info
  description: |
    Detected the presence of the Cisco Unified Communications User Management portal.
  reference:
    - https://developer.cisco.com/site/user-data-services/develop-and-test/api-reference/#version
  metadata:
    fofa-query: title="Unified Communications Self Care Portal"
    product: unified_communications_manager
    shodan-query: http.title:"Unified Communications Self Care Portal"
    vendor: cisco
    verified: true
  tags: cisco,detect,discovery,tech,ucm
http:
  - extractors:
      - name: version
        type: xpath
        xpath:
          - /versionInformation/version
          # digest: 490a00463044022026668db0ced39379c1e6405a26be12919a8fd59e5809b251b1b5d97916e0aa9f022071aef11e5ddd1526f4458fbbb776af936e0ed188e26c3c634d4d81035250711d:922c64590222798bb761d5b6d8e72950
    headers:
      Accept: application/xml
    matchers:
      - status:
          - 200
        type: status
      - condition: and
        part: body
        type: word
        words:
          - <versionInformation
          - <version>
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/cucm-uds/version'
