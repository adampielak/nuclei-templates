id: xwiki-detect
info:
  name: XWiki - Detection
  author: matejsmycka
  severity: info
  description: |
    XWiki Platform was discovered.
  metadata:
    fofa-query: body="data-xwiki-reference"
    max-request: 2
    product: xwiki
    shodan-query: html:"data-xwiki-reference"
    vendor: xwiki
    verified: true
  tags: detect,discovery,tech,xwiki
http:
  - extractors:
      - group: 1
        regex:
          - <html.*?data-xwiki-page="(.*?)"
        # digest: 4a0a00473045022100e32ce5cc660a8951445b342a34df6a1b4f1fba11adc193f34b94b0e8e43921ef02205d839c8a0f3aa15772361b4bd61e588182711bc6744e35303d176ad6951b9774:922c64590222798bb761d5b6d8e72950

        type: regex
    host-redirects: true
    matchers:
      - condition: and
        dsl:
          - status_code == 200 || status_code == 401
          - contains(body, "xwikiplatformversion")
        type: dsl
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/xwiki/'
    stop-at-first-match: true
