id: omeka-s-detect
info:
  name: Omeka S - Detect
  author: rxerium
  severity: info
  description: |
    Omeka S is an open-source web publishing platform for digital cultural heritage collections.
  reference:
    - https://omeka.org/s/
    - https://github.com/omeka/omeka-s
  metadata:
    max-request: 1
    product: omeka_s
    shodan-query: 'http.title:"Omeka S"'
    vendor: omeka
    verified: true
  tags: detect,library,omeka,omeka-s,research,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?i)<title>[^<]*Omeka S[^<]*</title>'
      - type: word
        part: body
        words:
          - '/application/asset/'
          - '&#x2F;application&#x2F;asset&#x2F;'
        condition: or
      - type: status
        status:
          - 200
