id: bludit-detect
info:
  name: Bludit - Detect
  author: rxerium
  severity: info
  description: |
    Bludit is an open-source flat-file content management system.
  reference:
    - https://www.bludit.com/
    - https://github.com/bludit/bludit
  metadata:
    max-request: 1
    product: bludit
    shodan-query: http.html:"Bludit"
    vendor: bludit
    verified: true
  tags: bludit,cms,detect,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    host-redirects: true
    max-redirects: 2
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<meta name="generator" content="Bludit"'
      - type: word
        part: body
        words:
          - '/bl-kernel/'
          - '/bl-themes/'
        condition: or
      - type: status
        status:
          - 200
