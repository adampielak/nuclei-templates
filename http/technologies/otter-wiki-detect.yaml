id: otter-wiki-detect
info:
  name: Otter Wiki - Detect
  author: rxerium
  severity: info
  description: |
    Otter Wiki is an open-source wiki powered by Python, Markdown, and Git.
  reference:
    - https://github.com/redimp/otterwiki
  metadata:
    max-request: 1
    product: otter_wiki
    shodan-query: 'http.title:"Otter Wiki"'
    vendor: redimp
    verified: true
  tags: detect,markdown,otterwiki,tech,wiki
http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    host-redirects: true
    max-redirects: 3
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '/static/css/otterwiki.css'
          - 'An Otter Wiki Logo'
        condition: and
      - type: status
        status:
          - 200
