id: headplane-detect
info:
  name: Headplane - Detect
  author: rxerium
  severity: info
  description: |
    Headplane is an open-source web management interface for Headscale deployments.
  reference:
    - https://github.com/tale/headplane
  metadata:
    max-request: 1
    product: headplane
    shodan-query: http.title:"Headplane"
    vendor: tale
    verified: true
  tags: detect,discovery,headplane,headscale,remote-access,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/login"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>Headplane</title>'
          - '/admin/assets/entry.client-'
        condition: and
      - type: status
        status:
          - 200
