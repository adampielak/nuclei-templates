id: ruoyi-detect
info:
  name: RuoYi Detect
  author: xiangdangloser
  severity: info
  description: RuoYi (若依) admin framework was detected.
  reference:
    - https://github.com/yangzongzhuan/RuoYi
    - https://doc.ruoyi.vip/
  metadata:
    fofa-query: app="RuoYi"
    max-request: 1
    product: ruoyi
    shodan-query: http.html:"若依管理系统"
    vendor: ruoyi
    verified: true
  tags: detect,ruoyi,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}/login"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "若依管理系统"
          - "/static/ruoyi"
        condition: or
      - type: status
        status:
          - 200
