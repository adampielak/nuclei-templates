id: opensupports-detect
info:
  name: OpenSupports - Detect
  author: rxerium
  severity: info
  description: |
    OpenSupports is an open-source support ticket system.
  reference:
    - https://www.opensupports.com/
    - https://github.com/opensupports/opensupports
  metadata:
    max-request: 1
    product: opensupports
    shodan-query: http.title:"OpenSupports"
    vendor: opensupports
    verified: true
  tags: detect,helpdesk,opensupports,tech
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '<title>OpenSupports</title>'
          - 'opensupports_version'
        condition: and
      - type: status
        status:
          - 200
