id: administrate-dashboard
info:
  name: Administrate Dashboard Exposure
  author: DhiyaneshDk
  severity: high
  description: |
    Administrate Dashboard was exposed.
  reference:
    - https://github.com/thoughtbot/administrate
  metadata:
    fofa-query: body="Administrate"
    max-request: 1
    verified: true
  tags: administrate,exposure,misconfig,vuln
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Search Customers
          - Administrate
          - New customer</a>
      - status:
          - 200
        # digest: 4a0a00473045022022eb557407589833bf924a687deba928b03704df2b695ef598456abbab715b5102210087983a2da52c41cd1a812995293bfd6a07d0c632c8945f69f112a0b9f2c128f1:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/admin'
