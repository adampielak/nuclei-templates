id: transmission-dashboard
info:
  name: Transmission Dashboard - Detect
  author: fabaff
  severity: medium
  description: Transmission dashboard was detected.
  reference:
    - https://transmissionbt.com/
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
    cpe: cpe:2.3:a:transmissionbt:transmission:*:*:*:*:*:*:*:*
  metadata:
    max-request: 1
    product: transmission
    shodan-query: http.title:"Transmission Web Interface"
    vendor: transmissionbt
    verified: true
  tags: dashboard,discovery,exposure,misconfig,transmission
http:
  - host-redirects: true
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - The Transmission Project
          - Transmission Web Interface
      - part: server
        type: word
        words:
          - Transmission
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/transmission/web/'
