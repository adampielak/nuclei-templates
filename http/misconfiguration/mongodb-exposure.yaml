id: mongodb-exposure
info:
  name: MongoDB Exposure
  author: DhiyaneshDk
  severity: info
  description: |
    Detected MongoDB instances exposed over HTTP using the native driver port.
  metadata:
    runzero-review: REJECT/2026-01-23/potentially noisy
    max-request: 1
    shodan-query: html:"access MongoDB"
    verified: true
  tags: exposure,misconfig,mongodb,vuln
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - access MongoDB
      - status:
          - 200
        # digest: 490a004630440220636140d83950c450b69a94e373a5144dc2a73c47064b0eed9c9c8ae048ebc10802200176ef66c40c651ca7c15b7e24cc1341188bc4c4b41cf9419802f4de0054cbfb:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
