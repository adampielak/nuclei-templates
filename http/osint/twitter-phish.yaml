id: twitter-phish
info:
  name: Twitter/X phishing Detection
  author: rxerium
  severity: info
  description: |
    A Twitter/X phishing website was detected
  reference:
    - https://twitter.com
    - https://x.com
  metadata:
    max-request: 1
  tags: discovery,osint,phishing,twitter,x
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - Sign in to X
          - Log in to X
          - Sign in to Twitter
          - Log in to Twitter
      - condition: or
        part: body
        type: word
        words:
          - type="password"
          - type='password'
      - status:
          - 200
        type: status
      - condition: and
        # digest: 4a0a00473045022100e00c9f3550c4f7088aab1de380187dba23ad26248ce461c9192dd43c92eb4fbc02205b2f68131d0d554bc092e8a1b38eb2cf4785fbfec1f3b1614c6a8a934ee8baf0:922c64590222798bb761d5b6d8e72950

        dsl:
          - '!contains(host,"twitter.com")'
          - '!regex("(^|\\.)x\\.com$", host)'
          - '!contains(host,"twimg.com")'
        type: dsl
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
