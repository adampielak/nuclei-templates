id: webroot-login
info:
  name: Webroot Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: Webroot login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:webroot:secureanywhere:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Webroot - Login"})
    max-request: 1
    product: secureanywhere
    shodan-query: title:"Webroot - Login"
    vendor: webroot
    verified: true
  tags: discovery,panel,webroot
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>Webroot - Login</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/Login'
