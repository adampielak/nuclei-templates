id: structurizr-panel
info:
  name: Structurizr Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: Structurizr login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:structurizr:on-premises_installation:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1199592666"
    fofa-query: icon_hash=1199592666
    max-request: 2
    product: on-premises_installation
    shodan-query: http.favicon.hash:1199592666
    vendor: structurizr
    verified: true
  tags: detect,discovery,panel,structurizr
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Structurizr
          - alt="Structurizr
          - structurizrBackground
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/signin'
    stop-at-first-match: true
