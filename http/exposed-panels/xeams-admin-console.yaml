id: xeams-admin-console
info:
  name: Xeams Admin Console Login Panel - Detect
  author: theamanrawat
  severity: info
  description: Xeams Admin Console login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:synametrics:xeams:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)xeams admin"})
    fofa-query: title="xeams admin"
    google-query: intitle:"xeams admin"
    max-request: 2
    product: xeams
    shodan-query:
      - http.title:"Xeams Admin"
      - http.title:"xeams admin"
    vendor: synametrics
    verified: true
  tags: admin,console,discovery,panel,synametrics,xeams
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - <title>Xeams Admin Console
          - eXtended Email And Messaging Server</span>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/FrontController'
    stop-at-first-match: true
