id: vinchin-panel
info:
  name: Vinchin Backup & Recovery Panel - Detect
  author: pussycat0x
  severity: info
  description: Vinchin Backup & Recovery login panel was detected.
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:vinchin:vinchin_backup_and_recovery:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)VinChin"})
    max-request: 1
    product: vinchin_backup_and_recovery
    shodan-query: html:"VinChin"
    vendor: vinchin
    verified: true
  tags: discovery,login,panel,vinchin
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - Vinchin Backup & Recovery
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
