id: hpe-oneview-panel
info:
  name: HPE OneView - Panel Detect
  author: rxerium
  severity: info
  description: |
    HPE OneView is an infrastructure management platform that provides automated management, monitoring, and updates for HPE servers, storage, and networking resources through a unified interface.
  reference:
    - https://www.hpe.com/us/en/integrated-systems/software.html
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1569311459"
    max-request: 1
    product: oneview
    shodan-query: http.favicon.hash:-1569311459
    vendor: hp
    verified: true
  tags: discovery,hp,hpe,login,oneview,panel
http:
  - extractors:
      - group: 1
        internal: true
        name: version
        part: body
        regex:
          - var artifactVersion = "([0-9]+\.[0-9]+\.[0-9]+)"
        type: regex
      - kval:
          - version
        # digest: 4b0a00483046022100e955e3a6cbcfb97a9324d4dc4c9bbb80d563854fbd3a3c5a739f23889535ceb0022100e350615efef84c26b40d1828f17bebf3afce15cad7d8016fb7a752b658b15007:922c64590222798bb761d5b6d8e72950

        type: kval
    matchers:
      - type: word
        words:
          - <title>OneView
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
