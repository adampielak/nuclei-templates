id: wagtail-login
info:
  name: Wagtail Login - Detect
  author: kishore-hariram
  severity: info
  description: The Wagtail panel has been detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:torchbox:wagtail:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)wagtail - sign in"})
    fofa-query: title="wagtail - sign in"
    google-query: intitle:"wagtail - sign in"
    max-request: 2
    product: wagtail
    shodan-query:
      - title:"Wagtail - Sign in"
      - http.title:"wagtail - sign in"
    vendor: torchbox
    verified: true
  tags: discovery,panel,torchbox,wagtail
http:
  - matchers:
      - part: body
        type: word
        words:
          - Wagtail - Sign in
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login/?next=/'
      - '{{BaseURL}}/admin/login/?next=/admin/'
    stop-at-first-match: true
