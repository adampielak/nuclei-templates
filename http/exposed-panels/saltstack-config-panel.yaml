id: saltstack-config-panel
info:
  name: SaltStack Config Panel - Detect
  author: pussycat0x
  severity: info
  description: |
    SaltStack config panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:saltstack:saltstack:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)SaltStack Config"})
    max-request: 1
    product: saltstack
    shodan-query: title:"SaltStack Config"
    vendor: saltstack
    verified: true
  tags: discovery,login,panel,saltstack,vmware
http:
  - matchers:
      - part: body
        type: word
        words:
          - SaltStack Config
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
