id: superset-login
info:
  name: Apache Superset Login Panel - Detect
  author: DhiyaneshDk,righettod,icarot
  severity: info
  description: Apache Superset login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:superset:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "1582430156" || any(each(service["http.bodies"]), {# matches "(?i)apache superset"})
    fofa-query:
      - body="apache superset"
      - icon_hash=1582430156
    max-request: 2
    product: superset
    shodan-query:
      - http.favicon.hash:1582430156
      - http.html:"apache superset"
      - http.html:"superset"
    vendor: apache
    verified: true
  tags: apache,discovery,panel,superset
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - '&#34;version_string&#34;:\s+&#34;([0-9a-z\.\-]+)&#34;'
        type: regex
    host-redirects: true
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains(content_type, "text/html")
          - contains_any(body, "alt=\"Superset\"", "<title>Superset</title>", "SUPERSET", "superset")
        type: dsl
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login'
    stop-at-first-match: true
