id: sentinelone-console

info:
  name: SentinelOne Management Console Login Panel - Detect
  author: DhiyaneshDK
  severity: info
  description: SentinelOne Management Console login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)SentinelOne - Management Console"})
    verified: true
    max-request: 1
    shodan-query: title:"SentinelOne - Management Console"
  tags: panel,sentinelone,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}/login"

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'SentinelOne - Management Console'

      - type: status
        status:
          - 200

