id: sonicwall-sma-panel

info:
  name: SonicWall Secure Mobile Access (SMA) Panel - Detection
  author: DhiyaneshDk,darses
  severity: info
  description: |
    Detected SonicWall Secure Mobile Access (SMA) appliances — an enterprise SSL-VPN gateway for secure remote access (SMA 1000/6200/7200 series). Identifies SMA WorkPlace portal endpoints, extracting major release and build versions from the Server header or DOM documentation references, along with build timestamps from Last-Modified headers.
  reference:
    - https://www.sonicwall.com/products/remote-access/
    - https://www.sonicwall.com/support/technical-documentation/?category=Secure%20Remote%20Access
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0.0
  metadata:
    verified: true
    max-request: 4
    shodan-query: '"Server: SMA" "EXTRAWEB_REFERER"'
  tags: sonicwall,sma,ssl-vpn,vpn,tech,detect,login,panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/workplace/home.action"
      - "{{BaseURL}}/"

    host-redirects: true
    max-redirects: 2
    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "SonicWall"

      - type: regex
        regex:
          - '(?i)Server:\s*SMA/'
          - '(?i)EXTRAWEB_REFERER'
          - '(?i)<title>WorkPlace</title>'
          - '(?i)/__extraweb__/'
        condition: or

    extractors:
      - type: regex
        part: header
        name: sma-version
        group: 1
        regex:
          - '(?i)Server:\s*SMA/([a-zA-Z0-9.-]+)'

      - type: regex
        part: body
        name: doc-version
        group: 1
        regex:
          - '(?i)product=SMA%201000%20Series&version=([a-zA-Z0-9.-]+)'

  - method: GET
    path:
      - "{{BaseURL}}/__extraweb__/template.js"
      - "{{BaseURL}}/__extraweb__/SecureEndpointManager.js"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "Aventail Corporation"
          - "SonicWall"
        condition: or

    extractors:
      - type: regex
        part: header
        name: sma-version
        group: 1
        regex:
          - '(?i)Server:\s*SMA/([a-zA-Z0-9.-]+)'

      - type: regex
        part: header
        name: last-modified
        group: 1
        regex:
          - '(?i)Last-Modified:\s*([^\r\n]+)'
