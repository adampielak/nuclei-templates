id: spacelogic-cbus-panel
info:
  name: SpaceLogic C-Bus Home Panel - Detect
  author: ritikchaddha
  severity: info
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)spacelogic c-bus"})
    fofa-query: body="spacelogic c-bus"
    max-request: 1
    product: spacelogic_c-bus_home_controller_firmware
    shodan-query:
      - html:"SpaceLogic C-Bus"
      - http.html:"spacelogic c-bus"
    vendor: schneider-electric
    verified: true
  tags: discovery,login,panel,schneider-electric,spacelogic
http:
  - matchers:
      - condition: or
        type: word
        words:
          - <title>SpaceLogic C-Bus Home</title>
          - content="SpaceLogic C-Bus Home
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
