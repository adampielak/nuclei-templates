id: web-viewer-panel
info:
  name: Web Viewer for Samsung DVR - Detect
  author: JustaAcat
  severity: info
  classification:
    cpe: cpe:2.3:h:samsung:dvr:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)web viewer for samsung dvr"})
    fofa-query: title="web viewer for samsung dvr"
    google-query: intitle:"web viewer for samsung dvr"
    max-request: 1
    product: dvr
    shodan-query:
      - title:"Web Viewer for Samsung DVR"
      - http.title:"web viewer for samsung dvr"
    vendor: samsung
    verified: true
  tags: detect,discovery,panel,samsung,web-viewer
http:
  - matchers:
      - type: word
        words:
          - <title>Web Viewer for Samsung DVR</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
