id: solr-panel-exposure
info:
  name: Apache Solr Admin Panel - Detect
  author: pdteam
  severity: info
  description: Apache Solr admin panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:solr:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)solr admin"}) || any(each(service["html.titles"]), {# matches "(?i)apache solr"})
    fofa-query:
      - title="solr admin"
      - title="apache solr"
    google-query:
      - intitle:"apache solr"
      - intitle:"solr admin"
    max-request: 2
    product: solr
    shodan-query:
      - http.title:"Solr Admin"
      - http.title:"apache solr"
      - cpe:"cpe:2.3:a:apache:solr"
      - http.title:"solr admin"
    vendor: apache
    verified: true
  tags: admin,apache,discovery,panel,solr
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - favicon\.ico\?_=([0-9.]+)
        type: regex
    matchers:
      - part: body
        type: word
        words:
          - <title>Solr Admin</title>
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/solr/'
      - '{{BaseURL}}'
    stop-at-first-match: true
