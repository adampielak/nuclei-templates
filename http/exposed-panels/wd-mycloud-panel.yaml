id: wd-mycloud-panel
info:
  name: WD My Cloud Panel - Detect
  author: DhiyaneshDk
  severity: info
  reference:
    - https://www.zerodayinitiative.com/blog/2023/4/19/cve-2022-29844-a-classic-buffer-overflow-on-the-western-digital-my-cloud-pro-series-pr4100
  classification:
    cpe: cpe:2.3:a:western_digital:mycloud_nas:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1074357885"
    fofa-query: icon_hash=-1074357885
    max-request: 1
    product: mycloud_nas
    shodan-query: http.favicon.hash:-1074357885
    vendor: western_digital
    verified: true
  tags: detect,discovery,login,mycloud,panel,wd,western_digital
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - WDMyCloud
          - Cloud_Connection_StatusID
          - my_cloud_os
          - WD Privacy Statement
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
