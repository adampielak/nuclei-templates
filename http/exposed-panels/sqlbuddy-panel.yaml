id: sqlbuddy-panel
info:
  name: SQL Buddy Login Panel - Detect
  author: nullfuzz
  severity: info
  description: |
    SQL Buddy login panel was detected.
  reference:
    - http://sqlbuddy.com/
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sqlbuddy:sql_buddy:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)SQL Buddy"})
    max-request: 2
    product: sql_buddy
    shodan-query: http.title:"SQL Buddy"
    vendor: sqlbuddy
    verified: true
  tags: discovery,panel,sqlbuddy
http:
  - host-redirects: true
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains(body, '<title>SQL Buddy')
        type: dsl
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/sqlbuddy/'
    stop-at-first-match: true
