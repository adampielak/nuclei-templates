id: osnexus-panel
info:
  name: OSNEXUS QuantaStor Manager Panel - Detect
  author: Charles D.
  severity: info
  description: |
    OSNEXUS QuantaStor Manager login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:osnexus:quantastor:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)OSNEXUS QuantaStor Manager"})
    max-request: 1
    product: quantastor
    shodan-query: http.title:"OSNEXUS QuantaStor Manager"
    vendor: osnexus
  tags: discovery,login,osnexus,panel
http:
  - matchers:
      - type: word
        words:
          - <title>OSNEXUS QuantaStor Manager</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
