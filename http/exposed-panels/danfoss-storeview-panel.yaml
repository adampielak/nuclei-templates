id: danfoss-storeview-panel

info:
  name: Danfoss StoreView - Panel
  author: darses
  severity: info
  description: |
    Danfoss StoreView web interface was detected.
  reference:
    - https://www.danfoss.com/
  metadata:
    verified: true
    max-requests: 2
    vendor: danfoss
    product: storeview
    shodan-query:
      - http.favicon.hash:-853297641
      - title:"Danfoss StoreView"
      - title:"Danfoss - StoreView"
    driftnet-query:
      - title:"Danfoss StoreView"
      - title:"Danfoss - StoreView"
  tags: panel,danfoss,ics,detect,discovery

http:
  - method: GET
    path:
      - "{{BaseURL}}"

    host-redirects: true
    max-redirects: 2

    matchers-condition: or
    matchers:
      - type: dsl
        name: modern
        dsl:
          - 'status_code == 200 && contains_any(to_lower(body), "<title>danfoss storeview", "<title>danfoss - storeview", "<title>danfoss-storeview")'

      - type: dsl
        name: legacy
        dsl:
          - 'status_code == 200 && contains(to_lower(header), "mqx http") && (contains(to_lower(body), "webapp.swf") || regex("(?i)[0-9]*swfob\\.js", body))'

  - method: POST
    path:
      - "{{BaseURL}}/xml.cgi"

    headers:
      Content-Type: application/x-www-form-urlencoded

    body: '<cmd action="read_info"/>'

    matchers:
      - type: word
        name: xml
        part: body
        words:
          - '<resp action="read_info"'

    extractors:
      - type: regex
        name: version
        group: 1
        regex:
          - '(?i)(?:Softwareversie|Software\s*Version|Softwareversion)\s+([A-Z0-9.\-]+)'

      - type: regex
        name: model
        group: 1
        regex:
          - '(?i)(?:License\s*Model|Licenties|Licensing)\s+([A-Z0-9.\-]+)'

      - type: regex
        name: site
        group: 1
        regex:
          - '(?i)(?:Store\s*Name|Naam\s*inst\.?)\s{2,}(\S[^<]*?)\s*</name>'
