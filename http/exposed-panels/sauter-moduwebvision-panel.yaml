id: sauter-moduwebvision-panel
info:
  name: SAUTER moduWeb Vision Panel - Detect
  author: righettod
  severity: info
  description: |
    Sauter moduWeb Vision was detected.
  reference:
    - https://www.sauter-controls.com
  classification:
    cpe: cpe:2.3:o:sauter:moduweb_vision:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "-1663319756"
    fofa-query: icon_hash=-1663319756
    max-request: 1
    product: moduweb_vision
    shodan-query: http.favicon.hash:-1663319756
    vendor: sauter
    verified: true
  tags: discovery,login,moduweb,panel,sauter
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>SAUTER moduWeb Vision</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/login'
