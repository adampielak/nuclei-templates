id: syncserver-panel
info:
  name: Symmetricom SyncServer Panel - Detect
  author: DhiyaneshDk
  severity: info
  classification:
    cpe: cpe:2.3:o:microchip:syncserver_s650_firmware:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)symmetricom syncserver"})
    fofa-query: body="symmetricom syncserver"
    max-request: 1
    product: syncserver_s650_firmware
    shodan-query:
      - html:"Symmetricom SyncServer"
      - http.html:"symmetricom syncserver"
    vendor: microchip
    verified: true
  tags: detect,discovery,login,microchip,panel,symmetricom,syncserver
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - Symmetricom SyncServer ([A-Z0-9]+)
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - Symmetricom SyncServer
          - login
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login.php'
