id: vue-pacs-panel
info:
  name: Vue PACS - Panel
  author: righettod
  severity: info
  description: |
    Vue PACS was detected.
  reference:
    - https://www.usa.philips.com/healthcare/solutions/diagnostic-informatics/enterprise-imaging-pacs
  classification:
    cpe: cpe:2.3:a:philips:vue_pacs:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)vue pacs"})
    fofa-query: title="vue pacs"
    google-query: intitle:"vue pacs"
    max-request: 1
    product: vue_pacs
    shodan-query:
      - http.title:"Vue PACS"
      - http.title:"vue pacs"
    vendor: philips
    verified: true
  tags: discovery,login,pacs,panel,philips,vue
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - version=([a-z0-9\.\s\-]+)
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - <title>Vue PACS</title>
          - loginUsernameHidden
          - loginPasswordHidden
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/portal/WebLogin.aspx'
