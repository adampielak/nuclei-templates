id: sentry-panel
info:
  name: Sentry Login Panel
  author: righettod
  severity: info
  description: |
    Sentry login panel was detected.
  reference:
    - https://sentry.io/
  classification:
    cpe: cpe:2.3:a:sentry:sentry:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)login \\| sentry"})
    fofa-query: title="login | sentry"
    google-query: intitle:"login | sentry"
    max-request: 1
    product: sentry
    shodan-query:
      - http.title:"Login | Sentry"
      - http.title:"login | sentry"
    vendor: sentry
    verified: true
  tags: discovery,login,panel,sentry
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - (?i)"current":\s*"([0-9a-z.-]+)"
        type: regex
    matchers:
      - condition: and
        dsl:
          - status_code == 200
          - contains(body, "/sentry/") && contains(body, "Login")
          - regex("(?i)<title>[^<]*sentry[^<]*</title>", body)
        type: dsl
    max-redirects: 3
    method: GET
    path:
      - '{{BaseURL}}'
    redirects: true
