id: sap-successfactors-detect
info:
  name: SAP SuccessFactors Login Panel - Detect
  author: tess
  severity: info
  description: SAP SuccessFactors login panel was detected.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sap:successfactors:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)login - sap successfactors"})
    fofa-query: title="login - sap successfactors"
    google-query: intitle:"login - sap successfactors"
    max-request: 2
    product: successfactors
    shodan-query:
      - title:"Login - SAP SuccessFactors"
      - http.title:"login - sap successfactors"
    vendor: sap
    verified: true
  tags: detect,discovery,panel,sap
http:
  - host-redirects: true
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - SAP SuccessFactors
          - sap-ui-core
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/sf/start'
    stop-at-first-match: true
