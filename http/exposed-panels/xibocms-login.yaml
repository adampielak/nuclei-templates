id: xibocms-login
info:
  name: Xibo CMS Login Panel - Detect
  author: ritikchaddha,daffainfo
  severity: info
  description: Xibo CMS login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:springsignage:xibo:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)/xibosignage/xibo-cms"})
    max-request: 1
    product: xibo
    shodan-query: http.html:"/xibosignage/xibo-cms"
    vendor: springsignage
    verified: true
  tags: discovery,panel,xibocms
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - ([0-9.]+)            | <a id="source-link"
        type: regex
    matchers:
      - condition: and
        part: body
        type: word
        words:
          - xibo-cms
          - class="XiboFormButton
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/login'
