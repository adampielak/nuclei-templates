id: shardingsphere-panel
info:
  name: ShardingSphere ElasticJob UI Panel
  author: DhiyaneshDk
  severity: info
  description: An ShardingSphere ElasticJob UI panel was detected.
  classification:
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:shardingsphere_elasticjob-ui:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "816588900"
    fofa-query: icon_hash=816588900
    max-request: 1
    product: shardingsphere_elasticjob-ui
    shodan-query: http.favicon.hash:816588900
    vendor: apache
    verified: true
  tags: apache,discovery,login,panel,shardingsphere
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - <title>ShardingSphere ElasticJob UI</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}/#/login'
