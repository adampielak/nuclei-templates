id: proofpoint-protection-server-panel
info:
  name: Proofpoint Protection Server Panel - Detect
  author: johnk3r
  severity: info
  description: Proofpoint Protection Server panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  metadata:
    runzero-match: service["favicon.ico.image.mmh3"] == "942678640"
    fofa-query: icon_hash=942678640
    max-request: 2
    product: proofpoint protection server
    shodan-query: http.favicon.hash:942678640
    vendor: proofpoint
    verified: true
  tags: detect,discovery,login,panel,proofpoint
http:
  - host-redirects: true
    matchers:
      - condition: or
        part: body
        type: word
        words:
          - <TITLE>Proofpoint Protection Server
          - Proofpoint End User Application.
          - Powered by Proofpoint
      - part: header
        type: word
        words:
          - PPSAUTH=
    matchers-condition: or
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/euweb/login'
    stop-at-first-match: true
