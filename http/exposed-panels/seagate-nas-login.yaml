id: seagate-nas-login
info:
  name: Seagate NAS Login - Detect
  author: JustaAcat
  severity: info
  description: |
    Seagate NAS - SEAGATE Login was detected.
  classification:
    cpe: cpe:2.3:o:seagate:nas_os:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)seagate nas - seagate"})
    fofa-query: title="seagate nas - seagate"
    google-query: intitle:"seagate nas - seagate"
    max-request: 1
    product: nas_os
    shodan-query:
      - title:"Seagate NAS - SEAGATE"
      - http.title:"seagate nas - seagate"
    vendor: seagate
    verified: true
  tags: discovery,login,panel,seagate
http:
  - matchers:
      - case-insensitive: true
        type: word
        words:
          - Seagate NAS - SEAGATE
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
