id: cgit-detect
info:
  name: cgit Web Interface - Detection
  author: ritikchaddha
  severity: info
  description: |
    Detects cgit web interface for Git repositories. cgit is a hyperfast web frontend for Git repositories written in C. It provides a web-based interface to browse Git repositories, view commits, diffs, and files. cgit is designed to be publicly accessible for open source projects. However, detecting cgit instances
  reference:
    - https://git.zx2c4.com/cgit/about/
    - https://wiki.archlinux.org/title/Cgit
  metadata:
    runzero-review: REJECT/2026-01-26/this is "designed to be publicly accessible"
    fofa-query: body="cgit"
    google-query: intext:"generated by cgit"
    max-request: 1
    product: cgit
    shodan-query: http.html:"cgit"
    vendor: zx2c4
    verified: true
  tags: cgit,detect,discovery,git,panel,tech
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - cgit
          - generated by
      - condition: or
        part: body
        type: word
        words:
          - repository list
          - class='list nowrap'
          - id='cgit'
          - cgit.css
      - status:
          - 200
        # digest: 4b0a00483046022100c0859c79f133f151e261e0e6581d67cc429c44fc71370a0937c98092979a8b9b022100cbf7a0b0bfe03a0ac55f9e051e96689318585ecf4e88f5d3d83facf2a648224e:922c64590222798bb761d5b6d8e72950

        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/'
      - '{{BaseURL}}/cgit/'
    redirects: true
