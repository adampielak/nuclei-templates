id: webuzo-admin-panel
info:
  name: Webuzo Admin Login Panel - Detect
  author: theamanrawat
  severity: info
  description: Webuzo admin login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:softaculous:webuzo:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)webuzo - admin panel"})
    fofa-query: title="webuzo - admin panel"
    google-query: intitle:"webuzo - admin panel"
    max-request: 1
    product: webuzo
    shodan-query:
      - http.title:"Webuzo - Admin Panel"
      - http.title:"webuzo - admin panel"
    vendor: softaculous
    verified: true
  tags: admin,discovery,panel,softaculous,webuzo
http:
  - host-redirects: true
    matchers:
      - part: body
        type: word
        words:
          - Webuzo - Admin Panel
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
