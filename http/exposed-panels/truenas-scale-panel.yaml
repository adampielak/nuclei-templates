id: truenas-panel
info:
  name: TrueNAS Panel - Detect
  author: rxerium
  severity: info
  description: |
    TrueNAS scale is a free and open-source NAS solution
  reference:
    - https://www.truenas.com
  classification:
    cpe: cpe:2.3:h:ixsystems:truenas:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)truenas"})
    fofa-query: body="truenas"
    max-request: 1
    product: truenas
    shodan-query:
      - html:"TrueNAS"
      - http.html:"truenas"
    vendor: ixsystems
    verified: true
  tags: discovery,ixsystems,login,panel,truenas
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - '''TrueNAS'''
          - assets/images/TrueNAS
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/ui/sessions/signin'
