id: spotweb-login-panel
info:
  name: SpotWeb Login Panel - Detect
  author: theamanrawat
  severity: info
  classification:
    cpe: cpe:2.3:a:spotweb_project:spotweb:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)spotweb - overview"})
    fofa-query: title="spotweb - overview"
    google-query: intitle:"spotweb - overview"
    max-request: 1
    product: spotweb
    shodan-query:
      - title:"SpotWeb - overview"
      - http.title:"spotweb - overview"
    vendor: spotweb_project
    verified: true
  tags: detect,discovery,panel,spotweb,spotweb_project
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - SpotWeb - overview
          - initSpotwebJs
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
