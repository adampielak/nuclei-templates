id: ektron-cms-panel
info:
  name: Ektron CMS Login Panel - Detect
  author: pikpikcu
  severity: info
  description: Ektron CMS login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:ektron:ektron_content_management_system:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)ektron"})
    fofa-query:
      - app="Ektron-CMS"
      - app="ektron-cms"
      - body="ektron"
    max-request: 1
    product: ektron_content_management_system
    shodan-query:
      - http.html:"Ektron"
      - http.html:"ektron"
      - cpe:"cpe:2.3:a:ektron:ektron_content_management_system"
    vendor: ektron
    verified: true
  tags: cms,discovery,ektron,panel
http:
  - matchers:
      - condition: or
        part: body
        type: word
        words:
          - EktronClientManager
          - ektronTheme
          - Ektron.ready
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
