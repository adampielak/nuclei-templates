id: tooljet-panel
info:
  name: ToolJet Login Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: ToolJet login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:tooljet:tooljet:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)ToolJet - Dashboard"})
    max-request: 2
    product: tooljet
    shodan-query: title:"ToolJet - Dashboard"
    vendor: tooljet
    verified: true
  tags: discovery,panel,tooljet
http:
  - host-redirects: true
    matchers:
      - type: word
        words:
          - ToolJet - Dashboard
      - status:
          - 200
        type: status
    matchers-condition: and
    max-redirects: 2
    method: GET
    path:
      - '{{BaseURL}}'
      - '{{BaseURL}}/login?redirectTo=/'
    stop-at-first-match: true
