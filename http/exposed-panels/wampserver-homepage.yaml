id: wampserver-homepage
info:
  name: WampServer Panel - Detect
  author: DhiyaneshDk
  severity: info
  description: WampServer panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:wampserver:wampserver:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)WAMPSERVER Homepage"})
    max-request: 1
    product: wampserver
    shodan-query: title:"WAMPSERVER Homepage"
    vendor: wampserver
    verified: true
  tags: discovery,panel,wampserver
http:
  - matchers:
      - part: body
        type: word
        words:
          - <title>WAMPSERVER Homepage</title>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
