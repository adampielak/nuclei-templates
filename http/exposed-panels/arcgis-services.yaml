id: arcgis-api-service
info:
  name: ArcGIS REST Services Directory - Detect
  author: HeeresS
  severity: info
  description: Check for the existence of the "/arcgis/rest/services" path on an ArcGIS server.
  reference:
    - https://enterprise.arcgis.com/en/
  classification:
    cpe: cpe:2.3:a:esri:arcgis_server:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)arcgis"})
    fofa-query: title="arcgis"
    google-query: intitle:"arcgis"
    max-request: 1
    product: arcgis_server
    shodan-query:
      - title:"ArcGIS"
      - http.title:"arcgis"
    vendor: esri
    verified: true
  tags: api,arcgis,detect,discovery,esri,panel,rest
http:
  - extractors:
      - group: 1
        part: body
        regex:
          - Current Version:\s*<\/b>\s*([0-9.]+)
        type: regex
    matchers:
      - condition: and
        type: word
        words:
          - REST Services Directory
          - ArcGIS
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/arcgis/rest/services'
