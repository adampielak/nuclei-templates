id: spark-panel
info:
  name: Apache Spark Panel - Detect
  author: righettod
  severity: info
  description: Apache Spark panel was detected.
  reference:
    - https://www.hypeinnovation.com
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:apache:spark:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["http.bodies"]), {# matches "(?i)/apps/imt/html/"}) || any(each(service["html.titles"]), {# matches "(?i)spark master at"})
    fofa-query:
      - title="spark master at"
      - body="/apps/imt/html/"
    google-query: intitle:"spark master at"
    max-request: 1
    product: spark
    shodan-query:
      - html:"/apps/IMT/Html/"
      - http.html:"/apps/imt/html/"
      - http.title:"spark master at"
    vendor: apache
    verified: true
  tags: apache,discovery,panel,spark
http:
  - matchers:
      - part: body
        type: word
        words:
          - url=servlet/hype
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}'
