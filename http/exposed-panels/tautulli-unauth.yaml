id: tautulli-unauth
info:
  name: Tautulli Panel - Unauthenticated Access
  author: ritikchaddha
  severity: medium
  classification:
    cpe: cpe:2.3:a:tautulli:tautulli:*:*:*:*:*:*:*:*
  metadata:
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)tautulli - home"}) || any(each(service["html.titles"]), {# matches "(?i)tautulli"})
    fofa-query:
      - title="tautulli - home"
      - title="tautulli"
    google-query:
      - intitle:"tautulli"
      - intitle:"tautulli - home"
    max-request: 1
    product: tautulli
    shodan-query:
      - title:"Tautulli - Home"
      - http.title:"tautulli"
      - http.title:"tautulli - home"
    vendor: tautulli
    verified: true
  tags: discovery,exposure,misconfig,panel,tautulli,unauth
http:
  - matchers:
      - condition: and
        part: body
        type: word
        words:
          - Tautulli - Home
          - Libraries</a>
      - status:
          - 200
        type: status
    matchers-condition: and
    method: GET
    path:
      - '{{BaseURL}}/home'
