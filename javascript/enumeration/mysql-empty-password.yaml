id: mysql-empty-password
info:
  name: MySQL - Empty Password
  author: DhiyaneshDk
  severity: high
  description: |
    Checks for MySQL servers with an empty password for root or anonymous.
  metadata:
    max-request: 3
    shodan-query: port:3306
  tags: js,mysql,network,vuln
javascript:
  - args:
      Host: '{{Host}}'
      Pass: ' '
      Port: "3306"
      User: '{{username}}'
    code: |
      var m = require("nuclei/mysql");
      var c = m.MySQLClient();
      c.Connect(Host,Port,User,Pass)
    matchers:
      - condition: and
        # digest: 4b0a00483046022100da5ddc8f7305685895ce7d99615a031443cd657fb2fb2d722e7125c4b9e04937022100be8c56abcbf420e3f280e906cb9073acefc256e0f85a964cdf7a364d39a812fa:922c64590222798bb761d5b6d8e72950

        dsl:
          - response == true
          - success == true
        type: dsl
    payloads:
      username:
        - root
        - anonymous
    pre-condition: |
      isPortOpen(Host,Port);
    stop-at-first-match: true
